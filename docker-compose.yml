services:
  mysql:
    image: mysql:8
    container_name: mysql8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "appdb"
      TZ: "UTC"
    command: ["--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
